name: release

# Publishes to PyPI when a version tag is pushed:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI trusted publishing, so no API token is stored in this repository.
# One-time setup on PyPI: the project does not exist yet, so add a *pending*
# publisher under Account -> Publishing -> Add a new pending publisher, with
# project name `whyrule`, owner `hjalti-hub`, repository `whyrule`, workflow
# `release.yml`, environment `pypi`. After the first release it becomes an
# ordinary publisher under Your projects -> whyrule -> Publishing.
#
# A PyPI version can never be reused or replaced. Everything that can be checked
# is therefore checked before the upload step runs, not after.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag must match the version in pyproject.toml
        # The classic release mistake: tag v0.2.0 while pyproject still says
        # 0.1.0. Since the version is what PyPI records, and it is permanent,
        # a mismatch is worth failing on before anything is built.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag: $tag"
          echo "pyproject.toml: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${version}. Fix pyproject.toml or retag; PyPI versions cannot be reused."
            exit 1
          fi

      - name: Tests must pass before anything is published
        run: python -m unittest discover -s tests -t . -v

      - name: The catalog and the rules must agree
        run: python tests/check_catalog.py

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: The built wheel must actually install and run
        # Building successfully is not the same as being usable. This installs
        # the artifact exactly as a user would and exercises the entry point.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/whyrule --version
          /tmp/verify/bin/whyrule --project examples/clean --no-user --fail-on note
          /tmp/verify/bin/whyrule rules > /dev/null
          if /tmp/verify/bin/whyrule --project examples/broken --no-user > /dev/null 2>&1; then
            echo "::error::the broken example reported nothing; the release would ship a tool that finds no faults"
            exit 1
          fi

      - name: Output must survive a closed pipe
        # whyskill and deadweight both shipped a BrokenPipeError traceback to
        # PyPI before this was caught, and a PyPI version cannot be replaced.
        # `rules` is the important case: its output is smaller than the stdout
        # buffer, so the write fails in the interpreter's shutdown flush rather
        # than anywhere the command itself can see.
        run: |
          /tmp/verify/bin/whyrule rules 2>/tmp/pipe.err | head -1 > /dev/null
          if grep -qE "BrokenPipeError|Traceback" /tmp/pipe.err; then
            echo "::error::piping into head printed a traceback"
            cat /tmp/pipe.err
            exit 1
          fi

      - name: No third-party runtime dependencies
        # Zero dependencies is a promise the README makes. Keep it enforced.
        run: |
          deps=$(/tmp/verify/bin/pip list --format=freeze | grep -v -E "^(pip|setuptools|wheel|whyrule)==" || true)
          if [ -n "$deps" ]; then
            echo "::error::unexpected runtime dependencies: $deps"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The only permission the upload needs. No secret is read, and none is
      # stored: PyPI verifies a short-lived OIDC token minted for this workflow.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
