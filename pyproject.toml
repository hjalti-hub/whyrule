[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whyrule"
version = "0.1.0"
description = "Find the CLAUDE.md instructions Claude never receives - dropped, unresolved, stripped, or contradicted."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "claude",
    "claude-code",
    "claude-md",
    "agents-md",
    "memory",
    "linter",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately empty: whyrule must run anywhere `python3` runs, including a bare
# CI container. The frontmatter reader and the glob matcher are first-party for
# the same reason they are not PyYAML and not `fnmatch` - they have to reproduce
# Claude Code's behaviour, not the nearest library's.
dependencies = []

[project.urls]
Homepage = "https://github.com/hjalti-hub/whyrule"
Issues = "https://github.com/hjalti-hub/whyrule/issues"

[project.scripts]
whyrule = "whyrule.cli:main"

[tool.setuptools.packages.find]
include = ["whyrule*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
